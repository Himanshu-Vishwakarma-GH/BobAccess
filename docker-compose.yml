version: "3.9"

services:
  bobaccess-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bobaccess-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - chroma-data:/app/data/chroma_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  chroma-data:
    driver: local
